version: 1
baseBranch: main
github:
  enabled: false
runner:
  kind: claude
  command:
    - node
    - .afk/smoke-runner.mjs
    - "{prompt}"
  reviewCommand:
    - node
    - .afk/smoke-runner.mjs
    - "{prompt}"
  requiredEnv: []
  envAllowlist:
    - GH_TOKEN
execution:
  backend: local-process
docker:
  image: afk-worker:latest
verification:
  - node --test
timeouts:
  runTimeoutMs: 1800000
  heartbeatStaleMs: 300000
paths:
  state: .afk/state.sqlite
  runs: .afk/runs
  worktrees: .afk/worktrees
