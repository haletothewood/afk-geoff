name: AFK Run

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: "GitHub issue URL containing an AFK execution brief"
        required: true
        type: string
      backend:
        description: "Execution backend"
        required: true
        default: "local-docker"
        type: choice
        options:
          - local-docker
      require_pr:
        description: "Require AFK to publish a pull request"
        required: true
        default: true
        type: boolean
      afk_repository:
        description: "Repository containing the AFK Geoff CLI"
        required: true
        default: "haletothewood/afk-geoff"
        type: string
      afk_ref:
        description: "Git ref for the AFK Geoff CLI checkout"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  afk-run:
    name: Run AFK work from issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target
          persist-credentials: true

      - name: Check out AFK Geoff
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.afk_repository }}
          ref: ${{ inputs.afk_ref }}
          path: afk-geoff
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: afk-geoff/pnpm-lock.yaml

      - name: Install AFK Geoff dependencies
        working-directory: afk-geoff
        run: pnpm install --frozen-lockfile

      - name: Preflight
        working-directory: target
        run: |
          set -o pipefail
          ../afk-geoff/packages/cli/bin/afk.js doctor --json | tee afk-doctor.json

      - name: Run AFK issue
        working-directory: target
        run: |
          set +e
          args=(run issue "${{ inputs.issue_url }}" --backend "${{ inputs.backend }}" --json)
          if [[ "${{ inputs.require_pr }}" == "true" ]]; then
            args+=(--pr)
          fi
          ../afk-geoff/packages/cli/bin/afk.js "${args[@]}" > afk-result.json
          status=$?
          cat afk-result.json
          exit "$status"

      - name: Upload AFK JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afk-run-json
          path: |
            target/afk-doctor.json
            target/afk-result.json
          if-no-files-found: warn
