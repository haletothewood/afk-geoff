version: 1
baseBranch: main
github:
  enabled: true
runner:
  kind: claude
  envAllowlist:
    - GH_TOKEN
    - ANTHROPIC_API_KEY
    - CLAUDE_CODE_OAUTH_TOKEN
docker:
  image: aiwf-worker:latest
verification: []
paths:
  state: .ai-workflows/state.sqlite
  runs: .ai-workflows/runs
  worktrees: .ai-workflows/worktrees
